<div
  class="standby-card"
  [class.selected]="application.selected"
  (click)="toggleSelection()"
>

  <div class="card-check">

    <input
      type="checkbox"
      [checked]="application.selected"
    >

  </div>

  <div class="card-body">

    <h3>
      {{ application.nombreAplicacion }}
    </h3>

    <span class="app-code">
      {{ application.codigoAplicacion }}
    </span>

    <div class="card-fields">

      <div class="card-field">
        <label>EVC</label>
        <span>{{ application.evc }}</span>
      </div>

      <div class="card-field">
        <label>Línea</label>
        <span>{{ application.linea }}</span>
      </div>

      <div class="card-field">
        <label>Responsable</label>
        <span>{{ application.responsable }}</span>
      </div>

    </div>

  </div>

</div>
