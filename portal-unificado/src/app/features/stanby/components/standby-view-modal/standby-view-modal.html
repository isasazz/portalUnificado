@if (visible()) {

<div class="modal-backdrop">

  <div class="modal-container">

    <div class="modal-header">

      <div class="modal-header__info">

        <h2>Detalle de standby</h2>

        @if (aplicacionCodigo()) {

          <div class="app-under-title">
            <span class="app-code">{{ aplicacionCodigo() }}</span>
            @if (aplicacionNombre()) {
              <span class="app-name">{{ aplicacionNombre() }}</span>
            }
          </div>

        }

      </div>

      <button
        type="button"
        class="close-button"
        (click)="close()"
      >
        ✕
      </button>

    </div>

    <div class="modal-body">

      @if (assignments().length === 0) {

        <div class="empty-detail">
          <p>
            No hay standby registrado para esta aplicación.
          </p>
        </div>

      } @else {

        <app-standby-month-view
          [assignments]="assignments()"
          [showPeopleList]="true"
          [hideAppChips]="false"
        />

      }

    </div>

  </div>

</div>

}
