@if (visible) {

<div class="modal-backdrop">

  <div class="modal-container">

    <div class="modal-header">

      <div class="modal-header__info">

        <h2>Ver Standby</h2>

        @if (aplicacionCodigo) {

          <div class="app-under-title">
            <span class="app-code">{{ aplicacionCodigo }}</span>
          </div>

        }

      </div>

      <button
        type="button"
        class="close-button"
        (click)="close()"
      >
        ✕
      </button>

    </div>

    <div class="modal-body">

      <app-standby-month-view
        [assignments]="assignments"
        [showPeopleList]="true"
        [hideAppChips]="true"
      />

    </div>

  </div>

</div>

}
