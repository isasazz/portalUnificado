@if (visible) {

<div class="alert-backdrop">

  <div
    class="alert-container"
    [class.alert-success]="variant === 'success'"
    [class.alert-info]="variant === 'info'"
  >

    <div class="alert-accent"></div>

    <div class="alert-header">

      <h2>{{ title }}</h2>

      <button
        class="close-button"
        (click)="close()"
      >
        ✕
      </button>

    </div>

    <div class="alert-body">

      <div class="alert-icon">
        @if (variant === 'success') {
          ✓
        } @else {
          i
        }
      </div>

      <p>{{ message }}</p>

      <button
        class="btn-corporate"
        (click)="close()"
      >
        Aceptar
      </button>

    </div>

  </div>

</div>

}
