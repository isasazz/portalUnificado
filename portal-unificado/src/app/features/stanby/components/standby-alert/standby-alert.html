@if (visible) {

<div class="alert-backdrop">

  <div class="alert-container">

    <div class="alert-header">

      <h2>{{ title }}</h2>

      <button
        class="close-button"
        (click)="close()"
      >
        ✕
      </button>

    </div>

    <div class="alert-body">

      <p>{{ message }}</p>

      <button
        class="btn-primary"
        (click)="close()"
      >
        Aceptar
      </button>

    </div>

  </div>

</div>

}
