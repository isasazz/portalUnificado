@if (visible) {

<div class="modal-backdrop">

  <div class="modal-container">

    <div class="modal-header">

      <div>

        <h2>Nuevo contacto</h2>

        <span class="modal-subtitle">
          Registro de contacto de aplicación
        </span>

      </div>

      <button
        class="close-button"
        (click)="close()"
      >
        ✕
      </button>

    </div>

    <div class="modal-body">

      <div class="form-grid">

        <div class="field">

          <label>EVC</label>

          <select>
            <option>Seleccione un EVC</option>
          </select>

        </div>

        <div class="field">

          <label>Línea</label>

          <select>
            <option>Seleccione una línea</option>
          </select>

        </div>

      </div>

      <div class="field">

        <label>Aplicación</label>

        <select>
          <option>Seleccione una aplicación</option>
        </select>

      </div>

      <div class="form-grid">

        <div class="field">

          <label>Nombre</label>

          <input
            type="text"
            placeholder="Nombre completo"
          />

        </div>

        <div class="field">

          <label>Celular</label>

          <app-phone-input
            [value]="celular"
            (valueChange)="onCelularChange($event)"
          />

        </div>

      </div>

      <div class="field">

        <label>Correo electrónico</label>

        <input
          type="email"
          placeholder="correo@bancolombia.com.co"
        />

      </div>

      <div class="form-grid">

        <div class="field">

          <label>Horario</label>

          <select>

            <option>24/7</option>

            <option>Personalizado</option>

          </select>

        </div>

        <div class="field">

          <label>Estado</label>

          <select>

            <option>Activo</option>

            <option>Inactivo</option>

          </select>

        </div>

      </div>

    </div>

    <div class="modal-footer">

  <button
    class="btn-secondary"
    (click)="close()"
  >
    Cancelar
  </button>

  <button class="btn-save">
    Guardar contacto
  </button>

</div>

  </div>

</div>

}
