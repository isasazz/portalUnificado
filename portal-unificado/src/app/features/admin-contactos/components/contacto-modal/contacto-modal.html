@if (visible) {

<div class="modal-backdrop">

  <div class="modal-container">

    <div class="modal-header">

      <div>

        <h2>Información de Aplicación</h2>

        <span class="codigo-app">
          NU0113001
        </span>

      </div>

      <button
        class="close-button"
        (click)="close()"
      >
        ✕
      </button>

    </div>

    <div class="tabs">

      <button
        class="tab"
        [class.active]="activeTab === 'detalle'"
        (click)="selectTab('detalle')"
      >
        Detalle
      </button>

      <button
        class="tab"
        [class.active]="activeTab === 'contacto'"
        (click)="selectTab('contacto')"
      >
        Contacto
      </button>

      <button
        class="tab"
        [class.active]="activeTab === 'standby'"
        (click)="selectTab('standby')"
      >
        Programación Standby
      </button>

      <button
        class="tab"
        [class.active]="activeTab === 'mantenimiento'"
        (click)="selectTab('mantenimiento')"
      >
        Ventana de mantenimiento
      </button>

    </div>

    <div class="modal-body">

      <!-- DETALLE -->

      @if (activeTab === 'detalle') {

        <div class="detalle-container">

          <div class="detalle-item">
            <label>TÍTULO DE APP</label>
            <span>Núcleo Único</span>
          </div>

          <div class="detalle-item">
            <label>CÓDIGO DE APP</label>
            <span>NU0113001</span>
          </div>

          <div class="detalle-item">
            <label>EVC</label>
            <span>EVC Core Bancario</span>
          </div>

          <div class="detalle-item">
            <label>LÍNEA</label>
            <span>Aplicaciones</span>
          </div>

          <div class="detalle-item">
            <label>RESPONSABLE</label>
            <span>Daniel Lopez Montes</span>
          </div>

        </div>

      }

      <!-- CONTACTO -->

      @if (activeTab === 'contacto') {

        <div class="contacto-container">

          <div class="form-row">

            <div class="field">

              <label>NOMBRE</label>

              <input
                type="text"
                value="Daniel Lopez Montes"
              />

            </div>

            <div class="field">

              <label>CELULAR</label>

              <input
                type="text"
                value="+573105390611"
              />

            </div>

          </div>

          <!-- PDN -->

          <div class="distribution-card">

            <div class="distribution-header pdn">
              PDN
            </div>

            <div class="distribution-content">

              <div class="field">

                <label>LISTA DE DISTRIBUCIÓN</label>

                <select>
                  <option>
                    dlmontes@bancolombia.com.co
                  </option>
                </select>

              </div>

              <div class="field">

                <label>CORREO CANAL TEAMS</label>

                <input
                  type="text"
                  value="nu0113001@bancolombia.com.co"
                />

              </div>

            </div>

          </div>

          <!-- QA -->

          <div class="distribution-card">

            <div class="distribution-header qa">
              QA
            </div>

            <div class="distribution-content">

              <div class="field">

                <label>LISTA DE DISTRIBUCIÓN</label>

                <select>
                  <option>
                    dlmontes@bancolombia.com.co
                  </option>
                </select>

              </div>

              <div class="field">

                <label>CORREO CANAL TEAMS</label>

                <input
                  type="text"
                  value="nu0113001@bancolombia.com.co"
                />

              </div>

            </div>

          </div>

          <!-- DEV -->

          <div class="distribution-card">

            <div class="distribution-header dev">
              DEV
            </div>

            <div class="distribution-content">

              <div class="field">

                <label>LISTA DE DISTRIBUCIÓN</label>

                <select>
                  <option>
                    dlmontes@bancolombia.com.co
                  </option>
                </select>

              </div>

              <div class="field">

                <label>CORREO CANAL TEAMS</label>

                <input
                  type="text"
                  value="nu0113001@bancolombia.com.co"
                />

              </div>

            </div>

          </div>

          <div class="footer-actions">

            <button class="btn-primary">
              Guardar
            </button>

          </div>

        </div>

      }

      <!-- STANDBY -->

      @if (activeTab === 'standby') {

        <app-standby-calendar />

      }

      @if (activeTab === 'mantenimiento') {

        <div class="mantenimiento-container">
        </div>

      }

    </div>

  </div>

</div>

}
