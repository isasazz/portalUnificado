<div class="nix-lista">
  <h1>Lista de Items NIX</h1>
  
  <div *ngIf="cargando" class="loading">
    <p>Cargando...</p>
  </div>

  <table *ngIf="!cargando && items.length > 0" class="tabla">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.id }}</td>
        <td>{{ item.nombre }}</td>
        <td>{{ item.descripcion }}</td>
        <td><span class="estado" [ngClass]="'estado-' + item.estado.toLowerCase()">{{ item.estado }}</span></td>
        <td class="acciones">
          <a [routerLink]="['/nix/detalle', item.id]" class="btn-link">Ver</a>
          <a [routerLink]="['/nix/detalle', item.id]" class="btn-link">Editar</a>
          <button (click)="eliminar(item.id)" class="btn-link btn-danger">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!cargando && items.length === 0" class="sin-items">
    <p>No hay items disponibles</p>
  </div>
</div>
