<div class="cartelera-standby-detalle">
  <h1>{{ titulo }}</h1>
  
  <div *ngIf="cargando" class="loading">
    <p>Cargando...</p>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="guardar()" *ngIf="!cargando" class="formulario">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        class="form-control"
        [class.error]="formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched"
      />
      <div *ngIf="formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched" class="error-msg">
        <p *ngIf="formulario.get('nombre')?.errors?.['required']">El nombre es requerido</p>
        <p *ngIf="formulario.get('nombre')?.errors?.['minlength']">El nombre debe tener al menos 3 caracteres</p>
      </div>
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        formControlName="descripcion"
        class="form-control"
        rows="5"
        [class.error]="formulario.get('descripcion')?.invalid && formulario.get('descripcion')?.touched"
      ></textarea>
      <div *ngIf="formulario.get('descripcion')?.invalid && formulario.get('descripcion')?.touched" class="error-msg">
        <p *ngIf="formulario.get('descripcion')?.errors?.['required']">La descripción es requerida</p>
        <p *ngIf="formulario.get('descripcion')?.errors?.['minlength']">La descripción debe tener al menos 10 caracteres</p>
      </div>
    </div>

    <div class="form-group">
      <label for="estado">Estado</label>
      <select id="estado" formControlName="estado" class="form-control">
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
      </select>
    </div>

    <div class="botones">
      <button type="submit" [disabled]="formulario.invalid || guardando" class="btn btn-primary">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
      <a routerLink="/cartelera-standby/lista" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
