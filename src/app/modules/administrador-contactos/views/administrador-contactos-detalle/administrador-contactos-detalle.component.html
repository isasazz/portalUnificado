<div class="administrador-contactos-detalle">
  <h1>{{ titulo }}</h1>
  
  <div *ngIf="cargando" class="loading">
    <p>Cargando...</p>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="guardar()" *ngIf="!cargando" class="formulario">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        class="form-control"
        [class.error]="formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched"
      />
      <div *ngIf="formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched" class="error-msg">
        <p *ngIf="formulario.get('nombre')?.errors?.['required']">El nombre es requerido</p>
        <p *ngIf="formulario.get('nombre')?.errors?.['minlength']">El nombre debe tener al menos 3 caracteres</p>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-control"
        [class.error]="formulario.get('email')?.invalid && formulario.get('email')?.touched"
      />
      <div *ngIf="formulario.get('email')?.invalid && formulario.get('email')?.touched" class="error-msg">
        <p *ngIf="formulario.get('email')?.errors?.['required']">El email es requerido</p>
        <p *ngIf="formulario.get('email')?.errors?.['email']">Ingrese un email válido</p>
      </div>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input
        type="tel"
        id="telefono"
        formControlName="telefono"
        class="form-control"
        [class.error]="formulario.get('telefono')?.invalid && formulario.get('telefono')?.touched"
      />
      <div *ngIf="formulario.get('telefono')?.invalid && formulario.get('telefono')?.touched" class="error-msg">
        <p *ngIf="formulario.get('telefono')?.errors?.['required']">El teléfono es requerido</p>
        <p *ngIf="formulario.get('telefono')?.errors?.['pattern']">Ingrese un teléfono válido (mínimo 10 dígitos)</p>
      </div>
    </div>

    <div class="form-group">
      <label for="empresa">Empresa</label>
      <input
        type="text"
        id="empresa"
        formControlName="empresa"
        class="form-control"
        [class.error]="formulario.get('empresa')?.invalid && formulario.get('empresa')?.touched"
      />
      <div *ngIf="formulario.get('empresa')?.invalid && formulario.get('empresa')?.touched" class="error-msg">
        <p *ngIf="formulario.get('empresa')?.errors?.['required']">La empresa es requerida</p>
      </div>
    </div>

    <div class="form-group">
      <label for="estado">Estado</label>
      <select id="estado" formControlName="estado" class="form-control">
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
      </select>
    </div>

    <div class="botones">
      <button type="submit" [disabled]="formulario.invalid || guardando" class="btn btn-primary">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
      <a routerLink="/administrador-contactos/lista" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
